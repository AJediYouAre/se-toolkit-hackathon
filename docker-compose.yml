services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: recipeapp
      POSTGRES_PASSWORD: recipepass
      POSTGRES_DB: recipes
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recipeapp -d recipes"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - appnet

  web:
    build: ./app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://recipeapp:recipepass@db:5432/recipes
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - appnet
    restart: unless-stopped

networks:
  appnet:
    driver: bridge

volumes:
  pgdata:
  uploads:
